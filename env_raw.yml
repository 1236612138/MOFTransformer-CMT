name: trans          # 更新已有环境
channels:
  - pytorch          # 官方 PyTorch 频道，放首位
  - conda-forge
dependencies:
  # ── 核心运行时 ──────────────────────────────
  - python=3.9
  - pip
  # ── 科学计算 ────────────────────────────────
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - psutil
  - requests
  # ── 材料科学 ────────────────────────────────
  - ase
  - spglib
  - pymatgen
  - monty
  # ── 深度学习（CPU 版）───────────────────────
  - pytorch          # 将自动匹配 3.9 对应的 CPU 包
  - torchvision
  - cpuonly          # 关键：禁用 CUDA 依赖
  - pytorch-lightning
  - torchmetrics
  - timm
  # ── 可视化 & 交互 ──────────────────────────
  - plotly
  - ipywidgets
  - ipympl
  # ── 其它常用 ────────────────────────────────
  - tabulate
  - python-dateutil
  - pytz
  - pyyaml
  - jinja2
  - traitlets
  - packaging
  - kiwisolver
  - fonttools

  # ────────────────── pip-only ───────────────
  - pip:
      - moftransformer==1.1.1
      - transformers==4.49.0
      - tokenizers==0.21.1
      - huggingface-hub==0.29.3
      - einops==0.8.1
      - safetensors==0.5.3
      - tensorboard==2.19.0
      - tensorboard-data-server==0.7.2
      - lightning-utilities==0.14.0
      - sacred==0.8.7
      - nvitop==1.4.2
      - propcache==0.3.0
      - narwhals==1.30.0
      - uncertainties==3.2.2
      - wget==3.2
      - yarl==1.18.3
      - aiohttp==3.11.13
      - aiohappyeyeballs==2.6.1
      - frozenlist==1.5.0
      - multidict==6.1.0
      - google-auth==2.38.0
      - grpcio==1.71.0
      - absl-py==2.1.0
      - filelock==3.17.0
      - fsspec==2025.3.0
      - tqdm==4.67.1      # pip 版本，双保险
# ─────────────────────────────────────────────
